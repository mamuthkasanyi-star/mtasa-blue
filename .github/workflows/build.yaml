name: Build

# RP fork: Nightly konfiguráció, VERSION_TYPE_UNSTABLE, fork-support netc.dll
# (lásd Shared/sdk/version.h és https://wiki.multitheftauto.com/wiki/Forks)
on:
  push:
  workflow_dispatch:
    inputs:
      windows:
        description: "Windows kliens fordítása is"
        type: boolean
        default: true

jobs:
  windows:
    strategy:
      matrix:
        platform: [win32]
    name: windows-${{ matrix.platform }}
    # push esetén a commit üzenetben „[csak linux]” → kihagyja a Windows fordítást
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.windows) || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[csak linux]')) }}
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        id: cache-dxfiles
        with:
          path: utils/DXFiles
          key: dxfiles-0001

      - name: Download DirectX
        if: steps.cache-dxfiles.outputs.cache-hit != 'true'
        run: Invoke-WebRequest https://mirror-cdn.multitheftauto.com/bdata/DXFiles.zip -OutFile utils/DXFiles.zip
        shell: powershell

      - name: Extract DirectX
        if: steps.cache-dxfiles.outputs.cache-hit != 'true'
        run: Expand-Archive -Path utils/DXFiles.zip -DestinationPath utils/DXFiles
        shell: powershell

      - name: Install CEF
        run: utils\premake5 install_cef

      - name: Install data files
        run: utils\premake5 install_data

      - name: Run Build
        run: win-build.bat nightly ${{ matrix.platform }}
        shell: cmd
        env:
          DXSDK_DIR: './utils/DXFiles/'
          CI: 'true'

      - name: Create build artifacts
        run: utils\premake5 compose_files

      - uses: actions/upload-artifact@v6
        with:
          name: InstallFiles-${{ matrix.platform }}
          path: InstallFiles/

  linux:
    strategy:
      matrix:
        architecture: [x64]
    name: linux-${{ matrix.architecture }}
    runs-on: ubuntu-latest
    container:
      image: docker://ghcr.io/multitheftauto/mtasa-blue-build:latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Build
        run: /docker-entrypoint.sh --arch=${{ matrix.architecture }} --config=nightly
        env:
          CI: 'true'

      # a build image-ben nincs CA tanúsítványtár → a net.so letöltése elbukik
      - name: Install CA certificates
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates

      # az install_data csak a server/x64 mappát hozza létre, az arm-okat nem
      - name: Install data files
        run: mkdir -p Bin/server/arm Bin/server/arm64 && utils/premake5 install_data

      - name: Create build artifacts
        run: utils/premake5 compose_files

      - uses: actions/upload-artifact@v6
        with:
          name: Server-linux-${{ matrix.architecture }}
          path: InstallFiles/
